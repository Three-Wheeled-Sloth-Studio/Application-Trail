name: Application Trail
repository: Three-Wheeled-Sloth-Studio/Application-Trail
visibility: public
license: AGPL-3.0
status: wp3-hosted-deployment
product_type: hosted-service-with-public-code

agent_academy:
  aligned_commit: 16691651776151a7eb1ebf13d99a92658e0684e6
  okf_profile: refs/okfProfile.yaml
  operating_instructions: refs/agents.yaml
  discovery: refs/index.md

purpose: >
  Capture job opportunities and applications with minimal browser friction,
  preserve historical listing evidence, synchronize records across machines,
  and derive job-market intelligence that improves durable resume positioning.

initial_user:
  mode: dogfood-first
  multi_machine_required: true
  primary_browser_targets:
    - Chrome
    - Edge

identity:
  intended_provider: Google OAuth
  custom_password_auth_mvp: false
  current_implementation: google-oauth-and-opaque-application-trail-sessions
  wp3_auth_design_status: implemented-hosted-validation-pending

persistence:
  canonical_store: PostgreSQL
  current_hosting_option: Hostinger VPS
  browser_storage_canonical: false
  shared_server_with_other_studio_apps: true
  independent_application_database: application_trail

hosting:
  production_web_domain: trail.threewheeledsloth.com
  production_origin: https://trail.threewheeledsloth.com
  production_api_url: https://trail.threewheeledsloth.com/api
  production_web_deployment: existing-hostinger-vps-pending-live-validation
  local_web_url: http://127.0.0.1:4320
  local_api_url: http://127.0.0.1:4310

ai:
  local_preference: Ollama
  hosted_byok_supported: true
  provider_neutral_boundary: required
  reference_project: Three-Wheeled-Sloth-Studio/Review-Room

mvp_statuses:
  - saved
  - applied
  - passed

core_invariants:
  - preserve_source_url_and_job_description
  - separate_opportunity_from_listing_observation
  - distinguish_source_from_derived_data
  - preserve_original_and_normalized_wording
  - user_corrections_survive_reprocessing
  - flag_possible_duplicates_and_reposts
  - extension_is_capture_surface_not_primary_management_ui
  - secrets_and_user_data_never_enter_public_git

current_executable_slice: >
  WP0 through WP2 are accepted. WP3 repository implementation adds Google identity,
  opaque web and extension sessions, extension pairing, same-origin hosted routing,
  a cross-machine opportunity list, and one-command local orchestration. Hosted VPS,
  HTTPS, Google client configuration, and the live cross-machine smoke remain the current gate.

next_gate: >
  Complete the hosted WP3 deployment at https://trail.threewheeledsloth.com,
  configure the exact Google OAuth callback, and pass the cross-machine dogfood gate
  before beginning WP4 extraction or enrichment.
