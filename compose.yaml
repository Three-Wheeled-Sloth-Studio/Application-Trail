services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: application_trail
      POSTGRES_USER: application_trail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-application_trail_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - application_trail_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_trail -d application_trail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  application_trail_postgres:
