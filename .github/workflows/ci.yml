name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: application_trail
          POSTGRES_USER: application_trail
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U application_trail -d application_trail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://application_trail@localhost:5432/application_trail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check tracked-path casing
        run: npm run check:case-collisions
      - name: Validate refs and OKF indexes
        run: npm run validate:refs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
