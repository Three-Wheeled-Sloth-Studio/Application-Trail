<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Trail</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Three-Wheeled Sloth Studio</p>
          <h1>Application Trail</h1>
          <p>Capture where you apply. Learn from the trail.</p>
        </div>
        <div class="account">
          <span id="account-name"></span>
          <a id="sign-in" class="button" href="/auth/google/start">Sign in with Google</a>
          <button id="sign-out" type="button" hidden>Sign out</button>
        </div>
      </header>

      <section class="status" aria-live="polite">
        <strong>WP3</strong>
        <span id="status">Checking your Application Trail session...</span>
      </section>

      <section id="opportunities-section" class="panel" hidden>
        <div class="section-heading">
          <h2>Opportunities</h2>
          <span id="opportunity-count"></span>
        </div>
        <div id="opportunity-list" class="opportunity-list"></div>
      </section>

      <article id="record" class="record panel" hidden>
        <p><a href="/">Back to opportunities</a></p>
        <h2 id="record-title"></h2>
        <p><strong id="record-company"></strong></p>
        <dl>
          <dt>Status</dt><dd id="record-status"></dd>
          <dt>Location</dt><dd id="record-location"></dd>
        </dl>
        <a id="record-source" target="_blank" rel="noreferrer"></a>
        <details>
          <summary>Captured source text</summary>
          <pre id="record-source-text"></pre>
        </details>
      </article>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
