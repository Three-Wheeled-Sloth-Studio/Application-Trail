<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Trail</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; width: 360px; }
      main { padding: 16px; }
      h1 { font-size: 1.1rem; margin: 0 0 12px; }
      dl { margin: 0 0 16px; }
      dt { font-size: 0.75rem; font-weight: 700; margin-top: 8px; text-transform: uppercase; }
      dd { margin: 2px 0 0; overflow-wrap: anywhere; }
      button { width: 100%; padding: 9px; margin-top: 8px; }
      .note { font-size: 0.8rem; opacity: 0.75; }
      #capture-status { min-height: 1.2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Application Trail</h1>
      <dl>
        <dt>Page</dt><dd id="page-title">Reading active page...</dd>
        <dt>URL</dt><dd id="page-url"></dd>
        <dt>Detected title</dt><dd id="detected-title">Inspecting...</dd>
        <dt>Detected company</dt><dd id="detected-company">Inspecting...</dd>
        <dt>Detected location</dt><dd id="detected-location">Inspecting...</dd>
      </dl>
      <button id="save" type="button" disabled>Save job</button>
      <button id="applied" type="button" disabled>I applied</button>
      <button id="open-record" type="button" hidden>Open full record</button>
      <p id="capture-status" class="note" aria-live="polite">Preparing capture...</p>
      <p class="note">WP2 uses a local development identity until Google sign-in lands in WP3.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
